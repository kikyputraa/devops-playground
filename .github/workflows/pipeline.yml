name: DevSecOps Pipeline

on:
  push:
    branches: [ "main", "staging" ]
    # Mencegah loop: Jangan jalankan pipeline jika perubahan hanya di folder k8s
    paths-ignore:
      - 'k8s/**'
      - 'README.md'

jobs:
  sast_bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install bandit && bandit -r app/ -ll

  unit_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Run Tests
        run: |
          pip install pytest pytest-cov Flask
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest --cov=app --cov-report=xml:coverage.xml tests/
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  sonarqube_check:
    needs: [unit_test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: coverage-report
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build_image:
    needs: [sonarqube_check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and Save
        run: |
          docker build -t kikyputraa/devops-playground:${{ github.sha }} .
          docker save kikyputraa/devops-playground:${{ github.sha }} > app_image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-artifact
          path: app_image.tar

  container_security:
    needs: [build_image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-artifact
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          input: 'app_image.tar'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

  push_image:
    needs: [container_security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-artifact
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Load and Push
        run: |
          docker load < app_image.tar
          docker push kikyputraa/devops-playground:${{ github.sha }}
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            docker tag kikyputraa/devops-playground:${{ github.sha }} kikyputraa/devops-playground:latest
            docker push kikyputraa/devops-playground:latest
          fi

  deploy_gitops:
    needs: [push_image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Manifests
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TARGET_DIR="k8s/prod"
          else
            TARGET_DIR="k8s/staging"
          fi
          sed -i "s|image: .*|image: kikyputraa/devops-playground:${{ github.sha }}|g" $TARGET_DIR/deployment.yaml

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            git add k8s/prod/deployment.yaml
          else
            git add k8s/staging/deployment.yaml
          fi
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            # Tanpa [skip ci], tapi loop dicegah oleh paths-ignore di atas
            git commit -m "chore: update ${{ github.ref_name }} image tag to ${{ github.sha }}"
            git push
          fi