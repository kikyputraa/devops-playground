name: DevSecOps Pipeline

on:
  push:
    branches: [ "main", "staging" ]

jobs:
  sast_bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install bandit && bandit -r app/ -ll

  unit_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Run Tests
        run: |
          pip install pytest pytest-cov Flask
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest --cov=app --cov-report=xml:coverage.xml tests/
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  sonarqube_check:
    needs: [sast_bandit, unit_test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: coverage-report
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build_image:
    needs: [sonarqube_check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and Save
        run: |
          docker build -t kikyputraa/devops-playground:${{ github.sha }} .
          docker save kikyputraa/devops-playground:${{ github.sha }} > app_image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-artifact
          path: app_image.tar

  container_security:
    needs: [build_image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-artifact
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          input: 'app_image.tar'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

  push_image:
    needs: [container_security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-artifact
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Load and Push
        run: |
          docker load < app_image.tar
          docker push kikyputraa/devops-playground:${{ github.sha }}
          docker tag kikyputraa/devops-playground:${{ github.sha }} kikyputraa/devops-playground:latest
          docker push kikyputraa/devops-playground:latest

  deploy_gitops:
    needs: [push_image]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Wajib agar bot bisa push balik ke repo
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Manifests
        run: |
          # 1. Tentukan env berdasarkan branch
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            NSP="default"; PT="30001"
          else
            NSP="staging"; PT="30002"
          fi
          
          # 2. Update file YAML
          sed -i "s|namespace:.*|namespace: $NSP|g" k8s/deployment.yaml
          sed -i "s|nodePort:.*|nodePort: $PT|g" k8s/service.yaml
          sed -i "s|image:.*|image: kikyputraa/devops-playground:${{ github.sha }}|g" k8s/deployment.yaml

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add k8s/deployment.yaml k8s/service.yaml
          
          # Cek jika ada perubahan sebelum commit agar tidak error
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update image tag to ${{ github.sha }} [skip ci]"
            git push
          fi