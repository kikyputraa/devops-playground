apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-prod   
  namespace: prod              
  labels:
    app: flask-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      # Level Pod Spec
      automountServiceAccountToken: false 
      containers:
      - name: flask-app
        image: kikyputraa/devops-playground:latest
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
            ephemeral-storage: "50Mi" # Masuk ke dalam requests
          limits:
            cpu: "200m"
            memory: "256Mi"