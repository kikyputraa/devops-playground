apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-canary
  namespace: prod
  labels:
    app: flask-app
    release: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-app
      release: canary
  template:
    metadata:
      labels:
        app: flask-app
        release: canary
    spec:
      automountServiceAccountToken: false
      containers:
      - name: flask-app
        image: kikyputraa/devops-playground:latest
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
            ephemeral-storage: "50Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"