apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-staging
  labels:
    app: flask-app
    env: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
      env: staging
  template:
    metadata:
      labels:
        app: flask-app
        env: staging
    spec:
      containers:
      - name: flask-app
        image: kikyputraa/devops-playground:da79ae6c08c205e54399543c072bc2a958e97504
        ports:
        - containerPort: 5000