apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-staging
  labels:
    app: flask-app
    env: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
      env: staging
  template:
    metadata:
      labels:
        app: flask-app
        env: staging
    spec:
      containers:
      - name: flask-app
        image: kikyputraa/devops-playground:2abba70ce1cb58658e02c453bec9cf8f8ec2006f
        ports:
        - containerPort: 5000