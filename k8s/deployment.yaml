apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-staging
  labels:
    app: flask-app
    env: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
      env: staging
  template:
    metadata:
      labels:
        app: flask-app
        env: staging
    spec:
      containers:
      - name: flask-app
        # Menggunakan tag latest
        image: kikyputraa/devops-playground:latest
        # Memaksa K8s tarik image baru setiap ada perubahan
        imagePullPolicy: Always
        ports:
        - containerPort: 5000